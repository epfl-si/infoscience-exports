all:
  hosts:
    openshift-4-dev:
      ansible_connection: local
      ansible_host: localhost
      ansible_python_interpreter: "{{ exportsible_suitcase_dir }}/bin/python3"
      openshift_namespace: svc0089d-infoscience
  vars:
    # Secrets
    keybase_base_folder: "/keybase/team/epfl_idevfsd/infoscience-exports"
    keybase_secrets_folder: "{{ keybase_base_folder }}/dev"

    # DB
    database:
      cluster: "postgres"
      host: "postgres-rw"
      name: "infoscience-exports"
      user: "infoscience_exports_user"
      password: "{{ lookup('file', keybase_secrets_folder ~ '/postgres_password.yaml') | from_yaml }}"
      size: "1Gi"
      backup_frequency: "0 0 3 1 * *"
      backup_s3: >-
        {{
          lookup('file', keybase_base_folder ~ '/S3_DEV_TEST_PROD.yaml')
          | from_yaml
          | combine({'folder': 'dev'})
        }}

    # Images building
    ## base
    python_image_version: "python:3.12-slim"
    python_image_source: "{{ quay_repo }}/{{ python_image_version }}"
    ## app
    app_build_image_git_branch: "main"
    app_built_image_tag: "latest"

    # Route
    avi_route_access_level: private

    # App
    ### Image
    app_version: "latest"
    app_image: "infoscience-exports:{{ app_version }}"
    app_image_source: "{{ quay_host }}/{{ quay_organisation_name }}/{{ app_image }}"

    ### Secrets
    secret_key_definition_path: "{{ keybase_secrets_folder }}/SECRET_KEY"

    ### Config
    django_settings_module: "settings.prod"
    django_site_url: "infoscience-exports-dev.10.98.42.200.nip.io"
    django_site_full_url: "https://{{ django_site_url }}"
    django_cache_timeout: "43200"
    django_range_display: "500"
    django_server_engine: "dspace"

    ### Security
    tequila_allowed_request_hosts: 10.98.84.179|10.98.84.180|10.98.84.181
