all:
  hosts:
    openshift-4-prod:
      ansible_connection: local
      ansible_host: localhost
      ansible_python_interpreter: "{{ exportsible_suitcase_dir }}/bin/python3"
      openshift_namespace: svc0089p-infoscience
  vars:
    # Secrets
    keybase_secrets_folder: "/keybase/team/epfl_idevfsd/infoscience-exports/prod"

    # DB
    database:
      cluster: "postgres"
      host: "postgres-rw"
      name: "infoscience-exports"
      user: "infoscience_exports_user"
      password: "{{ lookup('file', keybase_secrets_folder ~ '/postgres_password.yaml') | from_yaml }}"
      size: "5Gi"
      backup_frequency: "0 */6 * * * *"
      backup_retentionPolicy: "4d"
      backup_s3: >-
        {{
          lookup('file', keybase_base_folder ~ '/backup_S3_DEV_TEST_PROD.yaml')
          | from_yaml
          | combine({'folder': 'prod'})
        }}

    # Image building
    python_image_version: "python:3.12-slim"
    python_image_source: "{{ quay_repo }}/{{ python_image_version }}"

    # Route
    avi_route_access_level: public

    # App
    ### Image
    app_version: "prod"
    app_image: "infoscience-exports:{{ app_version }}"
    app_image_source: "{{ quay_host }}/{{ quay_organisation_name }}/{{ app_image }}"

    ### Secrets
    database_url_definition_path: "{{ keybase_secrets_folder }}/DATABASE_URL"
    secret_key_definition_path: "{{ keybase_secrets_folder }}/SECRET_KEY"

    ### Config
    django_settings_module: "settings.prod"
    #django_site_url: "infoscience-exports-prod.128.178.211.3.nip.io"
    django_site_url: "infoscience-exports.epfl.ch"
    django_site_full_url: "https://{{ django_site_url }}"
    django_cache_timeout: "43200"
    django_range_display: "500"
    django_server_engine: "dspace"

    ### Security
    tequila_allowed_request_hosts: 10.98.72.206|10.98.72.207|10.98.72.208
